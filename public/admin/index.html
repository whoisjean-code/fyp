<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Élite Inmobiliaria | Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css?v=5" />
</head>
<body>

    <!-- ═══════════════════════ LOGIN VIEW ═══════════════════════ -->
    <div id="loginView" class="view" style="display:none;">
        <div class="login-card glass">
            <div class="logo-mark">⬡</div>
            <h1 class="login-title">Acceso Asesor</h1>
            <p class="login-sub">Panel de control exclusivo</p>
            
            <form id="loginForm" class="admin-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="faridjeanpierreporras@gmail.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div id="loginError" class="error-msg" hidden>Credenciales incorrectas</div>
                <button type="submit" class="btn-primary" id="loginBtn">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- ═══════════════════════ DASHBOARD VIEW ═══════════════════════ -->
    <div id="dashboardView" class="view" style="display:none;">
        
        <nav class="admin-nav">
            <div class="nav-brand">
                <span class="logo-mark">⬡</span>
                <span>Élite Admin</span>
            </div>
            <button id="logoutBtn" class="btn-text" onclick="localStorage.removeItem('elite_admin_token'); window.location.href='/admin';">Cerrar Sesión</button>
        </nav>

        <main class="dashboard-main">
            <!-- ── PROPIEDADES ── -->
            <header class="dashboard-header">
                <div>
                    <h2 class="dash-title">Portafolio de Propiedades</h2>
                    <p class="dash-sub">Gestiona terrenos, casas y departamentos</p>
                </div>
                <button id="openUploadBtn" class="btn-primary">+ Nueva Propiedad</button>
            </header>

            <!-- Category Filter Tabs -->
            <div class="admin-tabs" id="adminCategoryTabs">
                <button class="admin-tab active" data-filter="todos">Todos</button>
                <button class="admin-tab" data-filter="terrenos">Terrenos</button>
                <button class="admin-tab" data-filter="casas">Casas</button>
                <button class="admin-tab" data-filter="departamentos">Departamentos</button>
            </div>

            <div class="properties-grid" id="propertiesGrid">
                <div class="loading-spinner"></div>
            </div>

            <!-- ── VIDEOS ── -->
            <header class="dashboard-header" style="margin-top: 3rem;">
                <div>
                    <h2 class="dash-title">Videos</h2>
                    <p class="dash-sub">Gestiona los videos de tu página</p>
                </div>
                <button id="openVideoUploadBtn" class="btn-primary">+ Subir Video</button>
            </header>

            <div class="properties-grid" id="videosGrid">
                <div class="loading-spinner"></div>
            </div>
        </main>
    </div>

    <!-- ═══════════════════════ UPLOAD PROPERTY MODAL ═══════════════════════ -->
    <div id="uploadModal" class="modal" style="display:none;">
        <div class="modal-overlay" onclick="document.getElementById('uploadModal').style.display='none';"></div>
        <div class="modal-content glass modal-large">
            <button class="modal-close" id="closeModalBtn">×</button>
            <h3 class="modal-title">Nueva Propiedad</h3>
            
            <form id="uploadForm" class="admin-form">
                <!-- Multi-image upload zone -->
                <div class="multi-upload-zone" id="uploadDropZone">
                    <label for="imageUpload" class="upload-zone-label">
                        <span class="upload-zone-icon">📷</span>
                        <span class="upload-zone-text">Arrastra o haz clic para subir imágenes</span>
                        <span class="upload-zone-hint">Máximo 10 imágenes por propiedad</span>
                    </label>
                    <input type="file" id="imageUpload" accept="image/*" multiple hidden>
                </div>
                <div class="image-previews" id="imagePreviews"></div>

                <!-- Category -->
                <div class="form-group">
                    <label for="propCategory">Categoría</label>
                    <select id="propCategory" required>
                        <option value="terrenos">Terrenos</option>
                        <option value="casas">Casas</option>
                        <option value="departamentos">Departamentos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="propTitle">Título</label>
                    <input type="text" id="propTitle" required placeholder="Ej: Terreno en San Carlos">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="propProvincia">Provincia</label>
                        <select id="propProvincia" onchange="actualizarDistritos()" required>
                            <option value="">Seleccione provincia...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="propLocation">Distrito</label>
                        <select id="propLocation" required disabled>
                            <option value="">Seleccione primero provincia</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="propPrice">Precio</label>
                        <input type="text" id="propPrice" required placeholder="Ej: $450,000">
                    </div>
                    <div class="form-group">
                        <label for="propArea">Área</label>
                        <input type="text" id="propArea" placeholder="Ej: 200 m²">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="propStatus">Estado</label>
                        <select id="propStatus">
                            <option value="Disponible">Disponible</option>
                            <option value="Vendido">Vendido</option>
                            <option value="En negociación">En negociación</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="propBedrooms">Dormitorios</label>
                        <input type="text" id="propBedrooms" placeholder="Ej: 3">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="propBathrooms">Baños</label>
                        <input type="text" id="propBathrooms" placeholder="Ej: 2">
                    </div>
                    <div class="form-group" style="visibility: hidden;">
                        <!-- Empty placeholder to keep row balanced -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="propDescription">Descripción</label>
                    <textarea id="propDescription" rows="3" placeholder="Descripción detallada de la propiedad..."></textarea>
                </div>

                <div class="form-group">
                    <label for="propMapUrl">Google Maps URL</label>
                    <input type="url" id="propMapUrl" placeholder="https://maps.google.com/...">
                </div>

                <div id="uploadError" class="error-msg" hidden></div>
                <button type="submit" class="btn-primary full-width" id="uploadSubmitBtn">Guardar Propiedad</button>
            </form>
        </div>
    </div>

    <!-- ═══════════════════════ EDIT PROPERTY MODAL ═══════════════════════ -->
    <div id="editModal" class="modal" style="display:none;">
        <div class="modal-overlay" onclick="document.getElementById('editModal').style.display='none';"></div>
        <div class="modal-content glass modal-large">
            <button class="modal-close" onclick="document.getElementById('editModal').style.display='none';">×</button>
            <h3 class="modal-title">Editar Propiedad</h3>
            
            <form id="editForm" class="admin-form">
                <input type="hidden" id="editPropId">

                <!-- Existing Images -->
                <label class="form-label-sm">Imágenes actuales</label>
                <div class="image-previews" id="editExistingImages"></div>

                <!-- Add More Images -->
                <div class="multi-upload-zone small" id="editUploadZone">
                    <label for="editImageUpload" class="upload-zone-label">
                        <span class="upload-zone-icon">➕</span>
                        <span class="upload-zone-text">Agregar más imágenes</span>
                    </label>
                    <input type="file" id="editImageUpload" accept="image/*" multiple hidden>
                </div>
                <div class="image-previews" id="editNewPreviews"></div>

                <!-- Category -->
                <div class="form-group">
                    <label for="editPropCategory">Categoría</label>
                    <select id="editPropCategory" required>
                        <option value="terrenos">Terrenos</option>
                        <option value="casas">Casas</option>
                        <option value="departamentos">Departamentos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editPropTitle">Título</label>
                    <input type="text" id="editPropTitle" required placeholder="Ej: Villa Moderna">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editPropProvincia">Provincia</label>
                        <select id="editPropProvincia" onchange="window.actualizarDistritos(document.getElementById('editPropProvincia'), document.getElementById('editPropLocation'))" required>
                            <option value="">Seleccione provincia...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editPropLocation">Distrito</label>
                        <select id="editPropLocation" required disabled>
                            <option value="">Seleccione primero provincia</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editPropPrice">Precio</label>
                        <input type="text" id="editPropPrice" required placeholder="Ej: $450,000">
                    </div>
                    <div class="form-group">
                        <label for="editPropArea">Área</label>
                        <input type="text" id="editPropArea" placeholder="Ej: 200 m²">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editPropStatus">Estado</label>
                        <select id="editPropStatus">
                            <option value="Disponible">Disponible</option>
                            <option value="Vendido">Vendido</option>
                            <option value="En negociación">En negociación</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editPropBedrooms">Dormitorios</label>
                        <input type="text" id="editPropBedrooms" placeholder="Ej: 3">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editPropBathrooms">Baños</label>
                        <input type="text" id="editPropBathrooms" placeholder="Ej: 2">
                    </div>
                    <div class="form-group" style="visibility: hidden;">
                        <!-- Empty placeholder to keep row balanced -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="editPropDescription">Descripción</label>
                    <textarea id="editPropDescription" rows="3" placeholder="Descripción detallada..."></textarea>
                </div>

                <div class="form-group">
                    <label for="editPropMapUrl">Google Maps URL</label>
                    <input type="url" id="editPropMapUrl" placeholder="https://maps.google.com/...">
                </div>

                <div id="editError" class="error-msg" hidden></div>
                <button type="submit" class="btn-primary full-width" id="editSubmitBtn">Actualizar Propiedad</button>
            </form>
        </div>
    </div>

    <!-- ═══════════════════════ UPLOAD VIDEO MODAL ═══════════════════════ -->
    <div id="videoModal" class="modal" style="display:none;">
        <div class="modal-overlay" onclick="document.getElementById('videoModal').style.display='none';"></div>
        <div class="modal-content glass">
            <button class="modal-close" onclick="document.getElementById('videoModal').style.display='none';">×</button>
            <h3 class="modal-title">Subir Video</h3>
            
            <form id="videoForm" class="admin-form">
                <div class="multi-upload-zone">
                    <label for="videoUpload" class="upload-zone-label">
                        <span class="upload-zone-icon">🎬</span>
                        <span class="upload-zone-text">Seleccionar video</span>
                    </label>
                    <input type="file" id="videoUpload" accept="video/*" required hidden>
                </div>
                <div id="videoPreviewContainer"></div>

                <div class="form-group">
                    <label for="videoTitle">Título del Video</label>
                    <input type="text" id="videoTitle" required placeholder="Ej: Recorrido Villa Moderna">
                </div>

                <div id="videoError" class="error-msg" hidden></div>
                <button type="submit" class="btn-primary full-width" id="videoSubmitBtn">Subir Video</button>
            </form>
        </div>
    </div>

    <script src="admin.js?v=5"></script>
</body>
</html>
